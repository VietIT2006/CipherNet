plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // JDBC Driver MySQL
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // H2 Database (In-memory / Embedded)
    implementation 'com.h2database:h2:2.3.232'

    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }

    // JVM trên Windows không nạp được -javaagent khi đường dẫn chứa ký tự Unicode tiếng Việt.
    // Do đó tự động tắt jacoco agent khi chạy local ở thư mục có dấu; trên CI (GitHub Actions) chạy 100%.
    boolean hasUnicodePath = project.projectDir.absolutePath.chars().anyMatch { it > 127 }
    if (hasUnicodePath && System.getenv("CI") == null) {
        jacoco {
            enabled = false
        }
    } else {
        finalizedBy jacocoTestReport
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

application {
    mainClass = 'com.detai10.server.ServerApp'
}

// Task đóng gói Fat JAR cho Server
tasks.register('serverJar', Jar) {
    archiveFileName = 'udp-server.jar'
    manifest {
        attributes 'Main-Class': 'com.detai10.server.ServerApp'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Task đóng gói Fat JAR cho Client
tasks.register('clientJar', Jar) {
    archiveFileName = 'udp-client.jar'
    manifest {
        attributes 'Main-Class': 'com.detai10.client.ClientApp'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Task shadowJar gom cả 2 Fat JAR
tasks.register('shadowJar') {
    dependsOn serverJar, clientJar
}

// Shortcut runServer và runClient
tasks.register('runServer', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.detai10.server.ServerApp'
}

tasks.register('runClient', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.detai10.client.ClientApp'
}

// Task chạy kiểm tra nhanh tầng Core độc lập (CORE-07)
tasks.register('coreSelfCheck', JavaExec) {
    group = 'verification'
    description = 'Chạy lớp tự kiểm tra nhanh độc lập các mô-đun tầng Core (Headless)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.detai10.core.CoreSelfCheck'
}
